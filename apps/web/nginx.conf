server {
    listen 80;
    server_name localhost;

    # Раздача скомпилированной статики фронтенда
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Если файл или папка не найдены — отдаем index.html (SPA роутинг)
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к бэкенду Fastify внутри Docker-сети
    location /api/ {
        # 'api' — это имя сервиса бэкенда в файле compose.yaml
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Включаем gzip сжатие статики для оптимизации производительности
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
